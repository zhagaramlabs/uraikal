name: release
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Self-checks
        run: for f in tests/test_*.py; do uv run --locked --extra tokenizers python "$f" || exit 1; done
      - name: Tag must match the package version
        run: test "${GITHUB_REF_NAME#v}" = "$(uv run --locked python -c 'import uraikal; print(uraikal.__version__)')"
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # Separate job so only the upload step holds the PyPI identity token.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3
      - name: GitHub Release
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
