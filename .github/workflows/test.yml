name: test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - name: Self-checks
        run: for f in tests/test_*.py; do uv run --locked --extra tokenizers python "$f" || exit 1; done
      - name: Doctests
        run: uv run --locked python -m doctest src/uraikal/text.py
